<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf9f6"><meta name="description" content="理解非法繁殖風險，找到台灣合法領養資源。">
  <title>{{ title }}｜{{ site.name }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-[#FAF9F6] text-slate-800">
<header class="sticky top-0 z-20 border-b border-slate-200/80 bg-[#FAF9F6]/95 backdrop-blur">
  <nav class="mx-auto flex max-w-7xl items-center justify-between px-5 py-4" aria-label="主要導覽">
    <a class="text-lg font-black tracking-tight" href="{{ url_for('home') }}">🐾 {{ site.name }}</a>
    <button class="rounded-lg border px-3 py-2 md:hidden" type="button" data-menu-button aria-expanded="false" aria-label="開啟導覽選單">選單</button>
    <div data-menu class="hidden absolute left-0 right-0 top-full border-b bg-[#FAF9F6] p-5 md:static md:flex md:items-center md:gap-6 md:border-0 md:bg-transparent md:p-0">
      <a class="block py-2 font-semibold hover:text-emerald-700" href="{{ url_for('home') }}">首頁</a>
      <a class="block py-2 font-semibold hover:text-emerald-700" href="{{ url_for('expose') }}">黑幕拆解</a>
      <a class="block py-2 font-semibold hover:text-emerald-700" href="{{ url_for('reality') }}">養狗現實</a>
      <a class="block py-2 font-semibold hover:text-emerald-700" href="{{ url_for('adopt') }}">領養指南</a>
    </div>
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
<footer class="mt-20 bg-slate-900 text-slate-100">
  <div class="mx-auto grid max-w-7xl gap-8 px-5 py-12 md:grid-cols-2">
    <div><p class="text-xl font-black">{{ site.name }}</p><p class="mt-3 max-w-xl text-sm text-slate-300">{{ site.tagline }}</p></div>
    <div class="rounded-2xl bg-slate-800 p-5"><h2 class="font-bold">遇到疑似違法繁殖或販售？</h2><p class="mt-2 text-sm text-slate-300">{{ site.law }}</p><p class="mt-3 font-bold text-amber-300">動物保護專線：{{ site.phone }}</p></div>
  </div>
  <p class="border-t border-slate-700 px-5 py-4 text-center text-xs text-slate-400">資訊為動物保護教育用途；個案及法規適用請以主管機關公告與認定為準。</p>
</footer>
<script src="{{ url_for('static', filename='site.js') }}" defer></script>
</body></html>
